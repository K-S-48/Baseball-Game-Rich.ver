<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/jquery-2.1.3.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <title>Baseball Game</title>
  </head>
  <body>
    <header>
      <h1>Baseball Game</h1>
    </header>
    <main>
      <div id="result"><h2>Play Ball!!</h2></div>
      <div class="game-container">
        <div class="controls">
          <button id="pitch">投げる</button>
          <button id="swing">スイング</button>
          <button id="restart">もう一度プレーする</button>
        </div>
        <div class="field">
          <div class="infield"></div>
          <div class="outfield"></div>
          <div id="first-base"></div>
          <div id="second-base"></div>
          <div id="third-base"></div>
          <div id="home-base"></div>
          <div class="pitcher"></div>
          <div id="ball"></div>
        </div>
        <div class="scoreboard">
          <div id="inning">1回表</div>

          <div class="match-score">
            YOU <span id="score">0</span>
            -
            <span id="pc-score">0</span> PC
          </div>
          <div id="bso">
            <div class="ball">
              <span class="bso">B</span>
              <div id="b-ciecles1"></div>
              <div id="b-ciecles2"></div>
              <div id="b-ciecles3"></div>
            </div>
            <div class="strike">
              <span class="bso">S</span>
              <div id="s-ciecles1"></div>
              <div id="s-ciecles2"></div>
            </div>
            <div class="out">
              <span class="bso">O</span>
              <div id="o-ciecles1"></div>
              <div id="o-ciecles2"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      let ball = 0;
      let strike = 0;
      let out = 0;
      let first = false;
      let second = false;
      let third = false;
      let score = 0;
      let pcScore = 0;
      let inning = 1;
      let isPlayer = true;

      function resetCount() {
        ball = 0;
        strike = 0;
        out = 0;

        first = false;
        second = false;
        third = false;

        $("#s-ciecles1, #s-ciecles2").css("background-color", "");
        $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css("background-color", "");
        $("#o-ciecles1, #o-ciecles2").css("background-color", "");

        $("#first-base, #second-base, #third-base").css("background-color", "");
      }
      function startPcAttack() {
        isPlayer = false;
        resetCount();

        $("#inning").html(inning + "回裏");
        $("#result").html("<h2>PCの攻撃！</h2>");
        $("#pitch, #swing").hide();

        let pcFirst = false;
        let pcSecond = false;
        let pcThird = false;

        function showPcBases() {
          $("#first-base").css("background-color", pcFirst ? "yellow" : "");
          $("#second-base").css("background-color", pcSecond ? "yellow" : "");
          $("#third-base").css("background-color", pcThird ? "yellow" : "");
        }
        function pcPitch() {
          const pitch =
            pitchTypes[Math.floor(Math.random() * pitchTypes.length)];
          $("#ball").css({ top: "64%", left: "50%" });
          $("#ball").animate(
            { top: "95%" },
            { duration: pitch.duration, easing: "linear", complete: pcResult },
          );
        }

        function pcResult() {
          const result = Math.ceil(Math.random() * 100);
          let flyNumber = result;

          if (result <= 20) {
            $("#result").html("<h2>PC：ヒット！</h2>");

            if (pcThird) {
              pcScore++;
            }

            pcThird = pcSecond;
            pcSecond = pcFirst;
            pcFirst = true;
          } else if (result <= 30) {
            $("#result").html("<h2>PC：ツーベース！</h2>");

            if (pcThird) pcScore++;
            if (pcSecond) pcScore++;

            pcThird = pcFirst;
            pcSecond = true;
            pcFirst = false;
          } else if (result <= 33) {
            $("#result").html("<h2>PC：スリーベース！</h2>");

            if (pcFirst) pcScore++;
            if (pcSecond) pcScore++;
            if (pcThird) pcScore++;

            pcFirst = false;
            pcSecond = false;
            pcThird = true;
          } else if (result <= 40) {
            $("#result").html("<h2>PC：ホームラン！</h2>");

            pcScore++;

            if (pcFirst) pcScore++;
            if (pcSecond) pcScore++;
            if (pcThird) pcScore++;

            pcFirst = false;
            pcSecond = false;
            pcThird = false;
          } else {
            flyNumber = pick(41, 75);
            out++;

            $("#result").html("<h2>PC：アウト！ " + out + "アウト</h2>");

            if (out == 1) {
              $("#o-ciecles1").css("background-color", "red");
            }

            if (out == 2) {
              $("#o-ciecles2").css("background-color", "red");
            }
          }

          $("#pc-score").html(pcScore);
          showPcBases();
          flyBall(flyNumber);

          if (out == 3) {
            setTimeout(endPcInning, 1500);
          } else {
            setTimeout(pcPitch, 1500);
          }
        }

        function endPcInning() {
          pcFirst = false;
          pcSecond = false;
          pcThird = false;
          showPcBases();
          if (inning == 3) {
            if (score > pcScore) {
              $("#result").html('<h2 class="win">YOU WIN!!</h2>');
              confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
              });
            } else if (score == pcScore) {
              $("#result").html("<h2>DRAW!</h2>");
            } else {
              $("#result").html("<h2>YOU LOSE...</h2>");
            }

            $("#restart").show();
            return;
          }

          inning++;
          isPlayer = true;
          resetCount();

          $("#inning").html(inning + "回表");
          $("#result").html("<h2>YOUR TURN!</h2>");
          $("#pitch, #swing").show();
        }

        setTimeout(pcPitch, 1000);
      }

      $("#swing").on("pointerdown", function () {
        console.log(
          "isPitching:",
          isPitching,
          "hasSwung:",
          hasSwung,
          "out:",
          out,
          "isPlayer:",
          isPlayer,
        );
        if (!isPitching || hasSwung) {
          return;
        }
        if (out == 3 || isPlayer == false) {
          return;
        }
        hasSwung = true;
        const result = getResultNumber(ballProgress);
        $("#ball").stop(true);
        // 動いているアニメーションを、その場で止める。true は、予約されている動きも消すという意味。
        ballProgress = 0;
        $("#ball").css("top", "64%");
        ballProgress = 0;
        flyBall(result);
        if (result >= 1 && result <= 20) {
          $("#result").html('<h2 class="one">ヒット</h2>');
          strike = 0;
          ball = 0;
          $("#s-ciecles1, #s-ciecles2").css("background-color", "");
          $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
            "background-color",
            "",
          );
          if (third == true) {
            third = false;
            $("#third-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          if (second == true) {
            third = true;
            $("#third-base").css("background-color", "yellow");
            second = false;
            $("#second-base").css("background-color", "");
          }
          if (first == true) {
            second = true;
            $("#second-base").css("background-color", "yellow");
          }

          $("#first-base").css("background-color", "yellow");
          first = true;
        }

        if (result >= 21 && result <= 30) {
          $("#result").html('<h2 class="double">ツーベース</h2>');
          strike = 0;
          ball = 0;
          $("#s-ciecles1, #s-ciecles2").css("background-color", "");
          $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
            "background-color",
            "",
          );
          if (third == true) {
            third = false;
            $("#third-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          if (second == true) {
            second = false;
            $("#second-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }

          if (first == true) {
            $("#third-base").css("background-color", "yellow");
            third = true;
            first = false;
            $("#first-base").css("background-color", "");
          }
          $("#second-base").css("background-color", "yellow");
          second = true;
        }
        if (result >= 31 && result <= 33) {
          $("#result").html('<h2 class="triple">スリーベース</h2>');
          strike = 0;
          ball = 0;
          $("#s-ciecles1, #s-ciecles2").css("background-color", "");
          $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
            "background-color",
            "",
          );
          if (third == true) {
            third = false;
            $("#third-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          if (second == true) {
            second = false;
            $("#second-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          if (first == true) {
            first = false;
            $("#first-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          $("#third-base").css("background-color", "yellow");
          third = true;
        }
        if (result >= 34 && result <= 40) {
          $("#result").html('<h2 class="homerun">HOME RUN!!</h2>');
          strike = 0;
          ball = 0;
          $("#s-ciecles1, #s-ciecles2").css("background-color", "");
          $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
            "background-color",
            "",
          );
          if (third == true) {
            third = false;
            $("#third-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          if (second == true) {
            second = false;
            $("#second-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          if (first == true) {
            first = false;
            $("#first-base").css("background-color", "");
            score++;
            $("#score").html(score);
          }
          score++;
          $("#score").html(score);
        }
        if (result >= 41 && result <= 60) {
          $("#result").html("<h2>ゴロ</h2>");
          strike = 0;
          ball = 0;
          out++;
          $("#s-ciecles1, #s-ciecles2").css("background-color", "");
          $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
            "background-color",
            "",
          );
          if (out == 1) {
            $("#o-ciecles1").css("background-color", "red");
          }
          if (out == 2) {
            $("#o-ciecles2").css("background-color", "red");
          }
        }
        if (result >= 61 && result <= 75) {
          $("#result").html("<h2>フライ</h2>");
          strike = 0;
          ball = 0;
          out++;
          $("#s-ciecles1, #s-ciecles2").css("background-color", "");
          $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
            "background-color",
            "",
          );
          if (out == 1) {
            $("#o-ciecles1").css("background-color", "red");
          }
          if (out == 2) {
            $("#o-ciecles2").css("background-color", "red");
          }
        }
        if (result >= 76 && result <= 90) {
          $("#result").html("<h2>空振り</h2>");
          strike++;
          if (strike == 1) {
            $("#s-ciecles1").css("background-color", "yellow");
          }
          if (strike == 2) {
            $("#s-ciecles2").css("background-color", "yellow");
          }
          if (strike == 3) {
            $("#result").html('<h2 class="strikeout">三振</h2>');
            strike = 0;
            ball = 0;
            out++;
            $("#s-ciecles1, #s-ciecles2").css("background-color", "");
            $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
              "background-color",
              "",
            );

            if (out == 1) {
              $("#o-ciecles1").css("background-color", "red");
            }
            if (out == 2) {
              $("#o-ciecles2").css("background-color", "red");
            }
          }
        }

        if (result >= 91 && result <= 100) {
          $("#result").html("<h2>ファール</h2>");
          if (strike < 2) {
            strike++;
          }

          if (strike == 1) {
            $("#s-ciecles1").css("background-color", "yellow");
          }
          if (strike == 2) {
            $("#s-ciecles2").css("background-color", "yellow");
          }
        }
        if (out == 3) {
          if (out == 3) {
            isPlayer = false;

            $("#pitch, #swing").hide();

            setTimeout(function () {
              startPcAttack();
            }, 1500);
          }
        }
      });

      function judgeTake() {
        const randomresult = Math.random();
        const result = Math.ceil(randomresult * 2);
        if (out == 3 || isPlayer == false) {
          return;
        }

        if (result == 1) {
          $("#result").html("<h2>ストライク</h2>");
          strike++;
          if (strike == 1) {
            $("#s-ciecles1").css("background-color", "yellow");
          }
          if (strike == 2) {
            $("#s-ciecles2").css("background-color", "yellow");
          }
          if (strike == 3) {
            $("#result").html('<h2 class="strikeout">三振</h2>');
            strike = 0;
            ball = 0;
            out++;
            $("#s-ciecles1, #s-ciecles2").css("background-color", "");
            $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
              "background-color",
              "",
            );

            if (out == 1) {
              $("#o-ciecles1").css("background-color", "red");
            }
            if (out == 2) {
              $("#o-ciecles2").css("background-color", "red");
            }
          }
        }
        if (result == 2) {
          $("#result").html("<h2>ボール</h2>");
          ball++;

          if (ball == 1) {
            $("#b-ciecles1").css("background-color", "green");
          }
          if (ball == 2) {
            $("#b-ciecles2").css("background-color", "green");
          }
          if (ball == 3) {
            $("#b-ciecles3").css("background-color", "green");
          }
          if (ball == 4) {
            $("#result").html("<h2>フォアボール</h2>");
            ball = 0;
            strike = 0;
            $("#s-ciecles1, #s-ciecles2").css("background-color", "");
            $("#b-ciecles1, #b-ciecles2, #b-ciecles3").css(
              "background-color",
              "",
            );
            if (first == true && second == true && third == true) {
              score++;
              $("#score").html("得点：" + score);
            }
            if (first == true && second == true) {
              $("#third-base").css("background-color", "yellow");
              third = true;
            }
            if (first == true) {
              $("#second-base").css("background-color", "yellow");
              second = true;
            }
            $("#first-base").css("background-color", "yellow");
            first = true;
          }
        }
        if (out == 3) {
          if (out == 3) {
            isPlayer = false;

            $("#pitch, #swing").hide();

            setTimeout(function () {
              startPcAttack();
            }, 1500);
          }
        }
      }
      let isPitching = false;
      //「今ボールが飛んでいるか」を覚えておく変数。
      let ballProgress = 0;
      // ボールの進み具合を覚えておく変数。投げ始めが 0、ホームに着く瞬間が 1 。
      let hasSwung = false;
      const pitchTypes = [
        { name: "スローボール", duration: 1400 },
        { name: "ストレート", duration: 800 },
        { name: "速球", duration: 600 },
      ];
      function pick(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      // min 以上 max 以下の整数を、ランダムに返す。Math.random() を使う定番の書き方。
      const SWEET_SPOT = 0.85;
      function getResultNumber(progress) {
        const d = Math.abs(progress - SWEET_SPOT);
        console.log("progress:", progress, "SWEET_SPOT:", SWEET_SPOT, "d:", d);
        // ボールが到着する位置（1）から、どれだけずれているか。Math.abs で、マイナスをプラスする。
        if (d <= 0.03) return pick(34, 40);
        if (d <= 0.05) return pick(21, 33);
        if (d <= 0.1) return pick(1, 20);
        if (d <= 0.15) return pick(41, 75);
        return pick(76, 100);
      }
      function resetBall() {
        $("#ball").css({ top: "64%", left: "50%" });
        isPitching = false;
        hasSwung = false;
      }

      function flyBall(result) {
        let top;
        let left;

        if (result <= 20) {
          top = "45%"; // ヒット
          left = pick(25, 75) + "%";
        } else if (result <= 30) {
          top = "25%"; // ツーベース
          left = pick(20, 80) + "%";
        } else if (result <= 33) {
          top = "15%"; // スリーベース
          left = pick(20, 80) + "%";
        } else if (result <= 40) {
          top = "3%"; // ホームラン
          left = pick(30, 70) + "%";
        } else if (result <= 60) {
          top = "55%"; // ゴロ
          left = pick(25, 75) + "%";
        } else if (result <= 75) {
          top = "35%"; // フライ
          left = pick(25, 75) + "%";
        } else if (result <= 90) {
          resetBall(); // 空振りは飛ばない
          return;
        } else {
          top = "80%"; // ファウル
          left = pick(0, 1) === 0 ? "5%" : "95%";
        }

        $("#ball").animate(
          { top: top, left: left },
          { duration: 700, easing: "linear", complete: resetBall },
        );
      }
      $("#pitch").on("click", function () {
        if (isPitching || !isPlayer) {
          return;
        }
        // ボールが飛んでいる最中や、PCの攻撃中（isPlayer が false）は、何もせずに終わる。連打して、ボールが何個も同時に動くのを防ぐ。! は「ではない」という意味。
        isPitching = true;
        hasSwung = false;
        ballProgress = 0;
        const pitch = pitchTypes[Math.floor(Math.random() * pitchTypes.length)];
        $("#ball").css("top", "64%");
        // 動かす前に、スタート位置へ戻す。

        $("#ball").animate(
          { top: "105%" },
          {
            duration: pitch.duration,
            easing: "linear",
            progress: function (animation, progress) {
              ballProgress = progress;
            },
            complete: function () {
              const swung = hasSwung;
              ballProgress = 0;
              hasSwung = false;
              $("#ball").css("top", "64%");
              isPitching = false;
              // ボールをスタート位置に戻して、isPitching を false にする。
              if (!swung) {
                judgeTake();
              }
            },
          },
        );
      });
      $("#restart").on("click", function () {
        location.reload();
        $("#pitch, #swing").show();
        $("#restart").hide();
      });
    </script>
  </body>
</html>
